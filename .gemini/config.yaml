# .gemini/config.yaml

# 1. 모델 및 코어 설정 (가장 중요)
model: "gemini-1.5-pro" # 퀄리티를 위해 flash 대신 pro 모델을 강력 추천합니다.
temperature: 0.2 # 0.0 ~ 1.0 사이. 낮을수록 창의성(헛소리)이 줄고 일관되고 엄격한 리뷰를 합니다.
language: "Korean"

# 2. 컨텍스트 및 규칙 파일 연결
styleguide_path: ".gemini/styleguide.md"

# 3. 무시할 파일 (AI의 집중력 분산 방지)
# 봇이 불필요한 설정 파일이나 에셋을 읽느라 컨텍스트 용량(토큰)을 낭비하지 않게 막아줍니다.
ignore:
  - "package-lock.json"
  - "yarn.lock"
  - "pnpm-lock.yaml"
  - "public/**/*"
  - "**/*.svg"
  - "**/*.png"
  - ".next/**/*"
  - "node_modules/**/*"
  - "*.config.js"

# 4. 커스텀 프롬프트 (리뷰어의 페르소나 부여)
prompt: |
  당신은 Taskify 대시보드 애플리케이션을 함께 개발하는 5인 프론트엔드 팀의 뛰어난 시니어 테크 리드입니다.
  단순한 오타 지적이나 포맷팅(들여쓰기 등)보다는, 아래 항목들에 집중해서 깐깐하고 깊이 있는 코드 리뷰를 진행해 주세요.
  
  1. 아키텍처 및 재사용성: 코드가 확장에 열려있는지, 공통된 UI나 로직(예: Button의 스타일별 파일 분리 등)이 잘 추상화되어 있는지 확인하세요.
  2. 렌더링 최적화: 불필요한 리렌더링을 유발하는 상태 관리나 Hook 사용이 없는지 검토하세요.
  3. 피드백 방식: 코드를 지적할 때는 "왜 이렇게 바꾸는 것이 좋은지"에 대한 명확한 이유와 함께 개선된 예시 코드를 반드시 제공하세요.
  4. .gemini/styleguide.md 에 정의된 규칙 위반 사항이 있다면 가장 최우선으로 지적하세요.
  